<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Casa rural completa con jardín privado y barbacoa">
  <defs>
    <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe0ea"/>
      <stop offset="70%" stop-color="#e6eddb"/>
      <stop offset="100%" stop-color="#b9c9a0"/>
    </linearGradient>
    <linearGradient id="wall4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0e6d2"/>
      <stop offset="100%" stop-color="#dccbb0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky4)"/>
  <!-- hills -->
  <path d="M0 380 L140 300 L300 380 L460 290 L640 380 L800 320 L800 600 L0 600 Z" fill="#7fa06a"/>
  <!-- roof -->
  <path d="M140 320 L400 190 L660 320 Z" fill="#a2503a"/>
  <path d="M140 320 L400 190 L660 320 Z" fill="none" stroke="#7c3a29" stroke-width="6"/>
  <!-- house -->
  <rect x="180" y="320" width="440" height="200" fill="url(#wall4)"/>
  <!-- door -->
  <rect x="360" y="400" width="80" height="120" rx="6" fill="#7c5233"/>
  <circle cx="430" cy="462" r="5" fill="#e7c98f"/>
  <!-- windows -->
  <g>
    <rect x="230" y="370" width="80" height="80" rx="4" fill="#8fb6c4"/>
    <rect x="490" y="370" width="80" height="80" rx="4" fill="#8fb6c4"/>
    <line x1="270" y1="370" x2="270" y2="450" stroke="#7c5233" stroke-width="6"/>
    <line x1="230" y1="410" x2="310" y2="410" stroke="#7c5233" stroke-width="6"/>
    <line x1="530" y1="370" x2="530" y2="450" stroke="#7c5233" stroke-width="6"/>
    <line x1="490" y1="410" x2="570" y2="410" stroke="#7c5233" stroke-width="6"/>
  </g>
  <!-- chimney -->
  <rect x="560" y="220" width="40" height="110" fill="#8a5a44"/>
  <!-- trees -->
  <g fill="#4b7647">
    <circle cx="120" cy="420" r="52"/>
    <circle cx="120" cy="420" r="52" fill="#385d35" opacity="0.5"/>
    <rect x="114" y="450" width="12" height="60" fill="#5d4023"/>
    <circle cx="690" cy="430" r="46"/>
    <rect x="685" y="455" width="10" height="55" fill="#5d4023"/>
  </g>
  <!-- garden path -->
  <path d="M360 540 Q400 480 400 520 Q400 480 440 540 Z" fill="#cbb089"/>
  <!-- barbecue -->
  <rect x="620" y="470" width="70" height="20" rx="6" fill="#3a3a3a"/>
  <rect x="632" y="490" width="8" height="50" fill="#5a5a5a"/>
  <rect x="670" y="490" width="8" height="50" fill="#5a5a5a"/>
  <ellipse cx="655" cy="470" rx="34" ry="8" fill="#6a6a6a"/>
</svg>
