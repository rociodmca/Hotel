<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Habitación doble superior con balcón y zona de estar">
  <defs>
    <linearGradient id="wall2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9ede5"/>
      <stop offset="100%" stop-color="#d9e0d2"/>
    </linearGradient>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9cfe0"/>
      <stop offset="100%" stop-color="#cfe0c2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#wall2)"/>
  <rect y="450" width="800" height="150" fill="#d8c4a4"/>
  <!-- balcony doors -->
  <rect x="420" y="70" width="300" height="330" rx="6" fill="#5f5241"/>
  <rect x="434" y="84" width="128" height="302" fill="url(#sky2)"/>
  <rect x="578" y="84" width="128" height="302" fill="url(#sky2)"/>
  <path d="M434 340 L500 250 L560 340 Z" fill="#7ea26a"/>
  <path d="M578 340 L650 260 L706 340 Z" fill="#7ea26a"/>
  <rect x="420" y="392" width="300" height="18" rx="4" fill="#4a4034"/>
  <!-- armchair -->
  <rect x="60" y="330" width="150" height="120" rx="18" fill="#c98f5a"/>
  <rect x="60" y="330" width="150" height="46" rx="16" fill="#d9a56e"/>
  <rect x="40" y="360" width="34" height="90" rx="14" fill="#b87c47"/>
  <rect x="196" y="360" width="34" height="90" rx="14" fill="#b87c47"/>
  <!-- coffee table -->
  <rect x="240" y="400" width="130" height="14" rx="6" fill="#6b5236"/>
  <rect x="292" y="414" width="26" height="50" fill="#6b5236"/>
  <!-- rug -->
  <ellipse cx="150" cy="500" rx="160" ry="46" fill="#b9a98e"/>
  <ellipse cx="150" cy="500" rx="110" ry="30" fill="#8fa07d"/>
  <!-- pendant -->
  <line x1="200" y1="0" x2="200" y2="120" stroke="#5f5241" stroke-width="4"/>
  <circle cx="200" cy="140" r="26" fill="#e7c98f"/>
