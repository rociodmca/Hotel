<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Suite Serranía con chimenea, jacuzzi y vistas panorámicas">
  <defs>
    <linearGradient id="wall3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b3630"/>
      <stop offset="100%" stop-color="#2a2621"/>
    </linearGradient>
    <linearGradient id="win3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0c98a"/>
      <stop offset="55%" stop-color="#d99a6a"/>
      <stop offset="100%" stop-color="#6d5a4a"/>
    </linearGradient>
    <radialGradient id="fire" cx="0.5" cy="0.6" r="0.6">
      <stop offset="0%" stop-color="#ffd98a"/>
      <stop offset="50%" stop-color="#e8843a"/>
      <stop offset="100%" stop-color="#b8401c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#wall3)"/>
  <rect y="460" width="800" height="140" fill="#4a3f33"/>
  <!-- panorama window -->
  <rect x="60" y="80" width="320" height="260" rx="8" fill="#1c1915"/>
  <rect x="74" y="94" width="292" height="232" fill="url(#win3)"/>
  <circle cx="300" cy="180" r="34" fill="#fff0cf"/>
  <path d="M74 280 L150 210 L220 280 L290 220 L366 290 L366 326 L74 326 Z" fill="#7a5a48"/>
  <!-- fireplace -->
  <rect x="470" y="140" width="250" height="300" rx="10" fill="#5a4a3c"/>
  <rect x="500" y="240" width="190" height="160" rx="8" fill="#1a1512"/>
  <ellipse cx="595" cy="340" rx="80" ry="70" fill="url(#fire)"/>
  <path d="M595 300 q-18 40 0 70 q18 -30 0 -70 q24 30 8 66 q-30 -22 -8 -66 z" fill="#ffb85c"/>
  <rect x="452" y="132" width="286" height="18" rx="6" fill="#6b5847"/>
  <!-- jacuzzi hint -->
  <ellipse cx="290" cy="480" rx="180" ry="52" fill="#8fb0b8"/>
  <ellipse cx="290" cy="480" rx="140" ry="38" fill="#bcd6dc"/>
  <g fill="#e8f4f6" opacity="0.8">
    <circle cx="220" cy="470" r="7"/>
    <circle cx="290" cy="460" r="9"/>
    <circle cx="360" cy="475" r="6"/>
  </g>
  <!-- candle glow -->
  <circle cx="460" cy="200" r="10" fill="#ffcf7a"/>
