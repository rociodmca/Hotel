<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Habitación estándar con cama doble y ventana a la sierra">
  <defs>
    <linearGradient id="wall1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#efe7d8"/>
      <stop offset="100%" stop-color="#e2d6c1"/>
    </linearGradient>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bcd6e0"/>
      <stop offset="60%" stop-color="#dfe6d2"/>
      <stop offset="100%" stop-color="#9fb98a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#wall1)"/>
  <rect y="440" width="800" height="160" fill="#c9b393"/>
  <!-- window -->
  <rect x="470" y="90" width="280" height="250" rx="6" fill="#7a6a53"/>
  <rect x="484" y="104" width="252" height="222" fill="url(#sky1)"/>
  <path d="M484 300 L560 240 L640 300 L700 250 L736 300 L736 326 L484 326 Z" fill="#7fa06a"/>
  <line x1="610" y1="104" x2="610" y2="326" stroke="#7a6a53" stroke-width="8"/>
  <line x1="484" y1="215" x2="736" y2="215" stroke="#7a6a53" stroke-width="8"/>
  <!-- bed -->
  <rect x="70" y="300" width="360" height="140" rx="14" fill="#f4efe4"/>
  <rect x="70" y="300" width="360" height="46" rx="12" fill="#cf9f6e"/>
  <rect x="90" y="250" width="150" height="66" rx="10" fill="#fbf8f1"/>
  <rect x="250" y="250" width="150" height="66" rx="10" fill="#fbf8f1"/>
  <rect x="60" y="290" width="380" height="16" rx="6" fill="#8a6b4a"/>
  <!-- nightstand + lamp -->
  <rect x="440" y="330" width="70" height="110" rx="6" fill="#8a6b4a"/>
  <rect x="452" y="300" width="46" height="34" rx="4" fill="#e7c98f"/>
  <!-- art -->
  <rect x="150" y="120" width="180" height="120" rx="4" fill="#dcd0ba"/>
  <path d="M150 220 L210 160 L250 200 L300 150 L330 220 Z" fill="#6f8f5f"/>
  <circle cx="200" cy="150" r="16" fill="#e0a55f"/>
</svg>
