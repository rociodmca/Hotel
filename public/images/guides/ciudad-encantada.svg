<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ciudad Encantada: formaciones kársticas del Parque Natural de la Serranía de Cuenca">
  <defs>
