    <path d="M420 460 q-24 -120 18 -170 q22 -28 44 4 q36 46 14 166 z"/>
    <path d="M540 470 q-20 -150 24 -200 q24 -30 44 2 q38 52 16 198 z"/>
  </g>
  <!-- grass -->
  <path d="M0 500 Q200 470 400 500 T800 495 L800 560 L0 560 Z" fill="#6f8f5f"/>
  <g fill="#4b7647">
