      <stop offset="0%" stop-color="#cfe4ec"/>
      <stop offset="100%" stop-color="#eef1e0"/>
    </linearGradient>
    <linearGradient id="rockG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9b393"/>
      <stop offset="100%" stop-color="#8f7a5e"/>
