<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ruta de las Caras: escultura tallada en roca junto al embalse de Buendía">
  <defs>
    <linearGradient id="skyG1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4d6a4"/>
      <stop offset="100%" stop-color="#e8ead0"/>
    </linearGradient>
    <linearGradient id="waterG1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9db8c4"/>
      <stop offset="100%" stop-color="#6f8f9e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="560" fill="url(#skyG1)"/>
  <circle cx="600" cy="150" r="60" fill="#ffe9bf"/>
  <path d="M0 340 L160 260 L340 340 L520 250 L700 340 L800 300 L800 560 L0 560 Z" fill="#8a9a72" opacity="0.7"/>
  <!-- rock with carved face -->
  <path d="M240 340 q-30 -120 30 -180 q60 -60 140 0 q50 60 20 180 z" fill="#b0895f"/>
  <path d="M240 340 q-30 -120 30 -180 q60 -60 140 0 q50 60 20 180 z" fill="none" stroke="#8f6b45" stroke-width="6"/>
  <!-- face features -->
  <g fill="#8f6b45">
    <ellipse cx="305" cy="215" rx="16" ry="10"/>
    <ellipse cx="385" cy="215" rx="16" ry="10"/>
    <path d="M330 240 q15 -8 30 0" stroke="#8f6b45" stroke-width="6" fill="none"/>
    <path d="M300 280 q45 30 90 0" stroke="#8f6b45" stroke-width="8" fill="none"/>
    <path d="M345 235 l-6 30 l14 0" stroke="#8f6b45" stroke-width="5" fill="none"/>
  </g>
  <!-- water -->
  <rect y="420" width="800" height="140" fill="url(#waterG1)"/>
  <g stroke="#cfe0e6" stroke-width="3" opacity="0.6">
    <path d="M60 460 q30 -10 60 0 t60 0 t60 0"/>
    <path d="M420 490 q30 -10 60 0 t60 0 t60 0"/>
    <path d="M200 520 q30 -10 60 0 t60 0 t60 0"/>
  </g>
